# Windows Java launchers read @argument-files in the platform encoding.
# COMPAT keeps Gradle's generated worker classpath readable with accented directory names.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=COMPAT
android.useAndroidX=true
# The workspace is named Navegação_GPS. Native libraries are prebuilt, not compiled here.
android.overridePathCheck=true
kotlin.code.style=official
